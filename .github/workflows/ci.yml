name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m ruff check groovescripting tests scripts examples
      - run: python -m pytest
      - run: python examples/smoke.py --output-dir smoke-output
      - name: Bash composition launcher
        if: runner.os == 'Linux'
        run: bash scripts/compose.sh --output bash-groove.wav
      - name: PowerShell launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts/groov*.ps1 | ForEach-Object { & $_.FullName --help; if ($LASTEXITCODE -ne 0) { throw "Launcher failed" } }
          & ./scripts/compose.ps1 --output powershell-groove.wav
          if ($LASTEXITCODE -ne 0) { throw "Composition failed" }
      - run: python -m build
      - run: python scripts/build_reference.py
      - run: python scripts/package_downloads.py
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.os }}-${{ matrix.python }}
          path: |
            dist/
            docs/downloads/


  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install ".[dev]"
      - run: >-
          python -m pytest
          tests/test_helpers.py
          tests/test_synth.py
          tests/test_devices.py
          tests/test_dispatch.py
          tests/test_visualizer.py
          tests/test_variation.py
          tests/test_automation.py
          tests/test_midi.py
          tests/test_tools.py
          --cov=groovescripting
          --cov-report=term-missing
          --cov-fail-under=70


  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install ".[audit]"
      - run: python -m pip_audit
