name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m ruff check groovescripting tests scripts examples
      - run: python -m pytest --cov=groovescripting --cov-report=term-missing --cov-fail-under=75
      - run: python examples/smoke.py --output-dir smoke-output
      - name: Bash composition launcher
        if: runner.os == 'Linux'
        run: bash scripts/compose.sh --output bash-groove.wav
      - name: PowerShell launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts/groov*.ps1 | ForEach-Object { & $_.FullName --help; if ($LASTEXITCODE -ne 0) { throw "Launcher failed" } }
          & ./scripts/compose.ps1 --output powershell-groove.wav
          if ($LASTEXITCODE -ne 0) { throw "Composition failed" }
      - run: python -m build
      - run: python scripts/build_reference.py
      - run: python scripts/package_downloads.py
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.os }}-${{ matrix.python }}
          path: |
            dist/
            docs/downloads/


  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install ".[audit]"
      - run: python -m pip_audit
