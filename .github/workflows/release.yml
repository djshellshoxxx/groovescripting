name: Release standalone executables
on:
  push:
    tags: ['v*']
    branches: ['claude/**']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag (for example v0.4.1)
        required: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: groovescripting-windows-x64.exe
          - os: ubuntu-22.04
            asset: groovescripting-linux-x64
          - os: macos-latest
            asset: groovescripting-macos-arm64
          - os: macos-15-intel
            asset: groovescripting-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libsndfile1
      - name: Install macOS audio libraries
        if: runner.os == 'macOS'
        run: brew install portaudio libsndfile
      - run: python -m pip install ".[dev,playback]" "pyinstaller>=6.10,<7"
      - name: Validate source
        shell: bash
        run: |
          python -m ruff check groovescripting tests scripts examples
          python -m pytest
      - name: Build executable
        shell: bash
        run: >-
          pyinstaller --onefile --clean --noconfirm
          --name groovescripting
          --paths .
          --collect-submodules groovescripting
          --collect-all soundfile
          --collect-all sounddevice
          --collect-data mido
          scripts/standalone.py
      - name: Smoke test executable
        shell: bash
        run: |
          exe=dist/groovescripting
          if [ "$RUNNER_OS" = "Windows" ]; then exe=dist/groovescripting.exe; fi
          "$exe" --version
          "$exe" groovseq examples/first-groove.json --output smoke.wav
          "$exe" groovinfo smoke.wav --json
          "$exe" groovlint examples/arrangement.json --audio smoke.wav
          "$exe" groovdebug examples/arrangement.json --format json --break 2 > /dev/null
          for tool in groovdrm groovbss groovld groovmix groovseq groovfx groovplay groovinfo groovmidi groovlint groovdebug groovtest groovtime groovmerge groovtheory; do
            "$exe" "$tool" --help > /dev/null
          done
          "$exe" groovdrm --preset breakbeat --bars 1 --limit --output drums.wav
          "$exe" groovfx drums.wav --effect '{"type":"gain","db":-3}' --output drums-fx.wav
          "$exe" groovmidi export examples/arrangement.json --output arrangement.mid
          "$exe" groovmidi import arrangement.mid --output imported.json --instrument lead
          "$exe" groovmerge examples/arrangement.json examples/arrangement.json examples/arrangement.json --output merged.json
          "$exe" groovtime log examples/arrangement.json > /dev/null
          "$exe" groovtheory progression C I vi IV V
          "$exe" groovplay --diagnose
          cp "$exe" "groovseq${exe##*groovescripting}"
          "./groovseq${exe##*groovescripting}" --version
      - name: Rename asset
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then mv dist/groovescripting.exe "dist/${{ matrix.asset }}"; else mv dist/groovescripting "dist/${{ matrix.asset }}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build && python -m build
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Verify tag and artifact checksums
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PYCODE'
          import hashlib
          import os
          from pathlib import Path
          from groovescripting import __version__
          if os.environ["TAG"] != "v" + __version__:
              raise SystemExit("Tag must match the checked out package version")
          files = sorted([*Path("assets").glob("*"), *Path("dist").glob("*")])
          Path("SHA256SUMS").write_text("".join(
              f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n"
              for p in files if p.is_file()
          ), encoding="utf-8")
          PYCODE
      - name: Publish new release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git rev-parse --verify "refs/tags/$TAG^{commit}"
          gh release create "$TAG" assets/* dist/* SHA256SUMS --verify-tag \
            --title "GrooveScripting $TAG" --notes-file .github/release-notes.md
