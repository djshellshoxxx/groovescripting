name: Release standalone executables
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update (for example v0.3.0)
        required: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: groovescripting-windows-x64.exe
          - os: ubuntu-22.04
            asset: groovescripting-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux audio libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libsndfile1
      - run: python -m pip install ".[playback]" "pyinstaller>=6.10,<7"
      - name: Build executable
        shell: bash
        run: >-
          pyinstaller --onefile --clean --noconfirm
          --name groovescripting
          --paths .
          --collect-submodules groovescripting
          --collect-all soundfile
          --collect-all sounddevice
          --collect-data mido
          scripts/standalone.py
      - name: Smoke test executable
        shell: bash
        run: |
          exe=dist/groovescripting
          if [ "$RUNNER_OS" = "Windows" ]; then exe=dist/groovescripting.exe; fi
          "$exe" --version
          "$exe" groovseq examples/first-groove.json --output smoke.wav
          "$exe" groovinfo smoke.wav --json
          "$exe" groovlint examples/arrangement.json --audio smoke.wav
          "$exe" groovdebug examples/arrangement.json --format json --break 2 > /dev/null
      - name: Rename asset
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then mv dist/groovescripting.exe "dist/${{ matrix.asset }}"; else mv dist/groovescripting "dist/${{ matrix.asset }}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build && python -m build
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          files="assets/* dist/*"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files --target "$GITHUB_SHA" --title "GrooveScripting $TAG" --notes-file .github/release-notes.md
          fi
