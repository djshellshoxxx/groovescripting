[build-system]
requires = ["setuptools>=77", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "groovescripting"
version = "0.1.0"
description = "Scriptable drum, bass and lead synthesis with synchronized offline arrangements"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "soundfile>=0.12,<0.14", "mido>=1.3,<2"]

[project.optional-dependencies]
playback = ["sounddevice>=0.4.6,<0.6"]
windows-volume = ["pycaw>=20240210; sys_platform == 'win32'", "comtypes>=1.2; sys_platform == 'win32'"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "build>=1,<2", "ruff>=0.9,<1"]
audit = ["pip-audit>=2.9,<3"]

[project.urls]
Repository = "https://github.com/djshellshoxxx/groovescripting"

[project.scripts]
groovdrm = "groovescripting.cli:drm"
groovbss = "groovescripting.cli:bss"
groovld = "groovescripting.cli:ld"
groovmix = "groovescripting.cli:mix"
groovseq = "groovescripting.cli:seq"
groovfx = "groovescripting.cli:fx"
groovplay = "groovescripting.cli:play"
groovinfo = "groovescripting.cli:info"
groovmidi = "groovescripting.midi:main"

[tool.setuptools.packages.find]
include = ["groovescripting*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
